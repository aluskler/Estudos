<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transações</title>
    <link
      rel="icon"
      href="https://cdn-icons-png.flaticon.com/512/876/876784.png"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <form>
      <input type="hidden" id="id" name="id" />
      <label for="titulo">Titulo:</label>
      <input type="text" id="titulo" /> <br />
      <label for="valor">Valor:</label>
      <div>
        <input type="number" id="valor" step="0.1" value="0" />
        <button type="button" class="btn-menos">-</button>
        <button type="button" class="btn-mais">+</button>
      </div>
      <br />
      <button type="submit" id="botao-salvar">Salvar</button>
    </form>
    <div id="saldo-historico">
      <h2>Saldo: <span id="span-saldo"></span></h2>
      <h2>Historico:</h2>
      <section id="transacoes"></section>
    </div>
  </body>
</html>
